models = ["oauth_social.models"]

[plugin]
id = "plugin-oauth-social"
slug = "oauth"
management_scope = "organization"
name = "OAuth Social Login"
description = "Provide Google/GitHub social login for the admin console."
name_i18n = "oauth_social:PLUGIN_NAME"
description_i18n = "oauth_social:PLUGIN_DESCRIPTION"
author = "Celestial Team"
version = "0.1.0"
requires = ">=2026.01.18-dev"
entrypoint = "oauth_social.plugin:OAuthSocialPlugin"
license = "MIT"
icon = "assets/logo.svg"
category = "data_integration"

[config_schema]
  [[config_schema.sections]]
  id = "google"
  title = "Google"
  title_i18n = "oauth_social:SECTION_GOOGLE"

    [[config_schema.sections.fields]]
    key = "enabled"
    type = "bool"
    default = false
    label_i18n = "oauth_social:FIELD_GOOGLE_ENABLED_LABEL"
    description_i18n = "oauth_social:FIELD_GOOGLE_ENABLED_DESC"

    [[config_schema.sections.fields]]
    key = "client_id"
    type = "str"
    label_i18n = "oauth_social:FIELD_GOOGLE_CLIENT_ID_LABEL"
    description_i18n = "oauth_social:FIELD_GOOGLE_CLIENT_ID_DESC"

    [[config_schema.sections.fields]]
    key = "client_secret"
    type = "str"
    secret = true
    ui = { input = "password" }
    label_i18n = "oauth_social:FIELD_GOOGLE_CLIENT_SECRET_LABEL"
    description_i18n = "oauth_social:FIELD_GOOGLE_CLIENT_SECRET_DESC"

  [[config_schema.sections]]
  id = "github"
  title = "GitHub"
  title_i18n = "oauth_social:SECTION_GITHUB"

    [[config_schema.sections.fields]]
    key = "enabled"
    type = "bool"
    default = false
    label_i18n = "oauth_social:FIELD_GITHUB_ENABLED_LABEL"
    description_i18n = "oauth_social:FIELD_GITHUB_ENABLED_DESC"

    [[config_schema.sections.fields]]
    key = "client_id"
    type = "str"
    label_i18n = "oauth_social:FIELD_GITHUB_CLIENT_ID_LABEL"
    description_i18n = "oauth_social:FIELD_GITHUB_CLIENT_ID_DESC"

    [[config_schema.sections.fields]]
    key = "client_secret"
    type = "str"
    secret = true
    ui = { input = "password" }
    label_i18n = "oauth_social:FIELD_GITHUB_CLIENT_SECRET_LABEL"
    description_i18n = "oauth_social:FIELD_GITHUB_CLIENT_SECRET_DESC"

  [[config_schema.sections]]
  id = "provisioning"
  title = "Provisioning"
  title_i18n = "oauth_social:SECTION_PROVISIONING"

    [[config_schema.sections.fields]]
    key = "auto_provision_enabled"
    type = "bool"
    default = false
    label_i18n = "oauth_social:FIELD_AUTO_PROVISION_ENABLED_LABEL"
    description_i18n = "oauth_social:FIELD_AUTO_PROVISION_ENABLED_DESC"

    [[config_schema.sections.fields]]
    key = "auto_accept_email_invites"
    type = "bool"
    default = false
    label_i18n = "oauth_social:FIELD_AUTO_ACCEPT_EMAIL_INVITES_LABEL"
    description_i18n = "oauth_social:FIELD_AUTO_ACCEPT_EMAIL_INVITES_DESC"
