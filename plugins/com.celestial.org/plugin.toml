models = ["org.models"]

dependencies = [
  { id = "com.celestial.rbac.core", version = ">=1.0.0", optional = false },
]

[plugin]
id = "com.celestial.org"
slug = "org"
name = "组织管理插件"
description = "提供部门、岗位与用户组织关系管理"
name_i18n = "org:PLUGIN_NAME"
description_i18n = "org:PLUGIN_DESCRIPTION"
author = "Celestial Team"
version = "1.0.0"
requires = ">=2026.01.18-dev"
entrypoint = "org.plugin:OrgPlugin"
license = "MIT"

[[permissions]]
code = "admin:org:departments:read"
name = "Read departments"
description = "Allow listing and viewing departments."
name_i18n = "org:PERM_DEPARTMENTS_READ_NAME"
description_i18n = "org:PERM_DEPARTMENTS_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:org:departments:write"
name = "Manage departments"
description = "Allow creating, updating, and deleting departments."
name_i18n = "org:PERM_DEPARTMENTS_WRITE_NAME"
description_i18n = "org:PERM_DEPARTMENTS_WRITE_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:org:positions:read"
name = "Read positions"
description = "Allow listing and viewing positions."
name_i18n = "org:PERM_POSITIONS_READ_NAME"
description_i18n = "org:PERM_POSITIONS_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:org:positions:write"
name = "Manage positions"
description = "Allow creating, updating, and deleting positions."
name_i18n = "org:PERM_POSITIONS_WRITE_NAME"
description_i18n = "org:PERM_POSITIONS_WRITE_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:org:users:assign"
name = "Assign user departments and positions"
description = "Allow assigning departments/positions to users and setting primary department."
name_i18n = "org:PERM_USERS_ASSIGN_NAME"
description_i18n = "org:PERM_USERS_ASSIGN_DESC"
default_roles = ["admin"]
