[plugin]
id = "com.celestial.admin.users"
name = "Admin Users 插件"
description = "提供管理后台用户管理（CRUD/禁用/重置密码）能力"
name_i18n = "admin_users:PLUGIN_NAME"
description_i18n = "admin_users:PLUGIN_DESCRIPTION"
author = "Celestial Team"
version = "1.0.0"
requires = ">=2026.01.18-dev"
entrypoint = "admin_users.plugin:AdminUsersPlugin"

[[dependencies]]
id = "com.celestial.rbac.core"
version = ">=1.0.0"
optional = false

[[permissions]]
code = "admin:users:read"
name = "Read admin users"
description = "Allow listing users and reading user details in admin console."
name_i18n = "admin_users:PERM_ADMIN_USERS_READ_NAME"
description_i18n = "admin_users:PERM_ADMIN_USERS_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:users:write"
name = "Manage admin users"
description = "Allow creating, updating, enabling and disabling users."
name_i18n = "admin_users:PERM_ADMIN_USERS_WRITE_NAME"
description_i18n = "admin_users:PERM_ADMIN_USERS_WRITE_DESC"
default_roles = ["admin"]

[[permissions]]
code = "admin:users:reset-password"
name = "Reset user password"
description = "Allow resetting user password in admin console."
name_i18n = "admin_users:PERM_ADMIN_USERS_RESET_PASSWORD_NAME"
description_i18n = "admin_users:PERM_ADMIN_USERS_RESET_PASSWORD_DESC"
default_roles = ["admin"]
