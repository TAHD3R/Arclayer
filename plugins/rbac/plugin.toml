models = ["rbac.models"]

[plugin]
id = "rbac"
name = "RBAC 权限插件"
description = "提供基于角色的权限控制"
author = "Celestial Team"
version = "1.0.0"
requires = ">=2026.01.18-dev"
entrypoint = "rbac.plugin:RBACPlugin"
website = "https://example.com"
repository = "https://github.com/example/celestial-rbac"
issues = "https://github.com/example/celestial-rbac/issues"
license = "MIT"

[[permissions]]
code = "users:read"
name = "查看用户"
description = "允许查看用户列表与详情"
default_roles = ["admin"]

[[permissions]]
code = "users:create"
name = "创建用户"
description = "允许创建用户"
default_roles = ["admin"]

[config_schema]
[[config_schema.sections]]
id = "general"
title = "基础设置"

[[config_schema.sections.fields]]
key = "default_role"
type = "str"
default = "user"
label = "默认角色"
