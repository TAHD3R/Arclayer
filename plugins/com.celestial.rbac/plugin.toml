models = ["rbac.models"]

[plugin]
id = "com.celestial.rbac"
name = "RBAC 权限插件"
description = "提供基于角色的权限控制"
author = "Celestial Team"
version = "1.0.0"
requires = ">=2026.01.18-dev"
entrypoint = "rbac.plugin:RBACPlugin"
website = "https://example.com"
repository = "https://github.com/example/celestial-rbac"
issues = "https://github.com/example/celestial-rbac/issues"
license = "MIT"

[[permissions]]
code = "rbac:roles:read"
name = "Read roles"
description = "Allow listing roles and role details."
default_roles = ["admin"]

[[permissions]]
code = "rbac:roles:write"
name = "Manage roles"
description = "Allow creating, updating, and deleting roles."
default_roles = ["admin"]

[[permissions]]
code = "rbac:users:assign"
name = "Assign user roles"
description = "Allow assigning and revoking user roles."
default_roles = ["admin"]

[[permissions]]
code = "rbac:permissions:read"
name = "Read permissions"
description = "Allow listing permissions."
default_roles = ["admin"]

[[permissions]]
code = "rbac:permissions:sync"
name = "Sync permissions"
description = "Allow syncing permissions from plugins."
default_roles = ["admin"]

[config_schema]
[[config_schema.sections]]
id = "general"
title = "General"

[[config_schema.sections.fields]]
key = "enforcement"
type = "bool"
default = false
label = "Enforce permissions"
description = "Enable RBAC permission checks when true."

[[config_schema.sections.fields]]
key = "bootstrap_enabled"
type = "bool"
default = true
label = "Enable bootstrap admin"
description = "Allow one-time admin bootstrap when no admin exists."
