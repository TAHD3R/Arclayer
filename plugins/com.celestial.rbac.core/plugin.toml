models = ["rbac.models"]

[plugin]
id = "com.celestial.rbac.core"
slug = "rbac-core"
name = "RBAC Core 插件"
description = "提供基于角色的权限控制与鉴权引擎"
name_i18n = "rbac:PLUGIN_NAME"
description_i18n = "rbac:PLUGIN_DESCRIPTION"
author = "Celestial Team"
version = "1.0.0"
requires = ">=2026.01.18-dev"
entrypoint = "rbac.plugin:RBACPlugin"
website = "https://example.com"
repository = "https://github.com/example/celestial-rbac"
issues = "https://github.com/example/celestial-rbac/issues"
license = "MIT"

[[permissions]]
code = "admin:access"
name = "Access admin console"
description = "Allow accessing /admin/** routes."
name_i18n = "rbac:PERM_ADMIN_ACCESS_NAME"
description_i18n = "rbac:PERM_ADMIN_ACCESS_DESC"
default_roles = ["admin"]

[[permissions]]
code = "system:plugins:read"
name = "Read plugins"
description = "Allow listing plugins and reading plugin details."
name_i18n = "rbac:PERM_SYSTEM_PLUGINS_READ_NAME"
description_i18n = "rbac:PERM_SYSTEM_PLUGINS_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "system:plugins:manage"
name = "Manage plugins"
description = "Allow installing, enabling, disabling, and configuring plugins."
name_i18n = "rbac:PERM_SYSTEM_PLUGINS_MANAGE_NAME"
description_i18n = "rbac:PERM_SYSTEM_PLUGINS_MANAGE_DESC"
default_roles = ["admin"]

[[permissions]]
code = "system:settings:read"
name = "Read settings"
description = "Allow reading system settings and plugin settings."
default_roles = ["admin"]

[[permissions]]
code = "system:settings:manage"
name = "Manage settings"
description = "Allow updating system settings and plugin settings."
default_roles = ["admin"]

[[permissions]]
code = "rbac:roles:read"
name = "Read roles"
description = "Allow listing roles and role details."
name_i18n = "rbac:PERM_ROLES_READ_NAME"
description_i18n = "rbac:PERM_ROLES_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "rbac:roles:write"
name = "Manage roles"
description = "Allow creating, updating, and deleting roles."
name_i18n = "rbac:PERM_ROLES_WRITE_NAME"
description_i18n = "rbac:PERM_ROLES_WRITE_DESC"
default_roles = ["admin"]

[[permissions]]
code = "rbac:users:assign"
name = "Assign user roles"
description = "Allow assigning and revoking user roles."
name_i18n = "rbac:PERM_USERS_ASSIGN_NAME"
description_i18n = "rbac:PERM_USERS_ASSIGN_DESC"
default_roles = ["admin"]

[[permissions]]
code = "rbac:permissions:read"
name = "Read permissions"
description = "Allow listing permissions."
name_i18n = "rbac:PERM_PERMISSIONS_READ_NAME"
description_i18n = "rbac:PERM_PERMISSIONS_READ_DESC"
default_roles = ["admin"]

[[permissions]]
code = "rbac:permissions:sync"
name = "Sync permissions"
description = "Allow syncing permissions from plugins."
name_i18n = "rbac:PERM_PERMISSIONS_SYNC_NAME"
description_i18n = "rbac:PERM_PERMISSIONS_SYNC_DESC"
default_roles = ["admin"]

[config_schema]
[[config_schema.sections]]
id = "general"
title = "General"
title_i18n = "rbac:CONFIG_GENERAL_TITLE"

[[config_schema.sections.fields]]
key = "enforcement"
type = "bool"
default = false
label = "Enforce permissions"
description = "Enable RBAC permission checks when true."
label_i18n = "rbac:CONFIG_ENFORCEMENT_LABEL"
description_i18n = "rbac:CONFIG_ENFORCEMENT_DESC"

[[config_schema.sections.fields]]
key = "bootstrap_enabled"
type = "bool"
default = true
label = "Enable bootstrap admin"
description = "Allow one-time admin bootstrap when no admin exists."
label_i18n = "rbac:CONFIG_BOOTSTRAP_LABEL"
description_i18n = "rbac:CONFIG_BOOTSTRAP_DESC"
