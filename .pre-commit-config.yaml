# Pre-commit hooks configuration
# See https://pre-commit.com for more information
repos:
  # Ruff - Fast Python linter and formatter
  # Basic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: local
    hooks:
      - id: frontend-format
        name: Frontend Format (oxfmt)
        entry: pnpm -w oxfmt
        language: system
        files: ^apps/web/
        pass_filenames: true

      # 静态检查
      - id: frontend-lint
        name: Frontend Lint (oxlint)
        entry: pnpm -w oxlint --fix
        language: system
        files: ^apps/web/
        pass_filenames: true
        args: ["--deny=correctness", "--deny=perf"]
