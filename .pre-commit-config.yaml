# Pre-commit hooks configuration
# See https://pre-commit.com for more information
repos:
  # Ruff - Fast Python linter and formatter
  # Basic pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/

  - repo: local
    hooks:
      - id: api-typecheck
        name: API Typecheck (ty)
        entry: pnpm -C apps/api typecheck
        language: system
        files: ^apps/api/(src|tests|scripts)/.*\.py$
        types: [python]
        pass_filenames: false

      - id: frontend-format
        name: Frontend Format (oxfmt)
        entry: pnpm -w exec oxfmt
        language: system
        files: ^(apps/(admin|portal|studio)|packages|plugins)/
        exclude: ^packages/openapi/src/generated/
        # 兼容较旧 identify：使用 ts/tsx 而非 typescript
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
        args: ["-c", "packages/internal/oxc/.oxfmtrc.json"]

      - id: frontend-lint
        name: Frontend Lint (oxlint)
        entry: pnpm -w exec oxlint
        language: system
        files: ^(apps/(admin|portal|studio)|packages|plugins)/
        exclude: ^packages/openapi/src/generated/
        # 兼容较旧 identify：使用 ts/tsx 而非 typescript
        types_or: [javascript, jsx, ts, tsx]
        pass_filenames: true
        args:
          [
            "-c",
            "packages/internal/oxc/.oxlintrc.json",
            "--fix",
            "--deny=correctness",
            "--deny=perf",
          ]
