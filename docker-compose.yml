services:
  postgres:
    image: postgres:16-alpine
    container_name: celestial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE__NAME:-celestial}
      POSTGRES_USER: ${DATABASE__USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE__PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--auth=scram-sha-256"
      TZ: ${TZ:-UTC}
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "hba_file=/etc/postgresql/pg_hba.conf",
      ]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestial

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: celestial-valkey
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./docker/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - celestial

volumes:
  postgres_data:
  valkey_data:

networks:
  celestial:
    driver: bridge
