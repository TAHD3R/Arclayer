services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arclayer-postgres
    restart: unless-stopped
    env_file:
      - ./docker/env/postgres.env
    command: >-
      postgres -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arclayer

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: arclayer-valkey
    restart: unless-stopped
    command: valkey-server /etc/valkey/valkey.conf
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
      - ./docker/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arclayer

  meilisearch:
    image: getmeili/meilisearch:v1.12.1
    container_name: arclayer-meilisearch
    restart: unless-stopped
    env_file:
      - ./docker/env/meilisearch.env
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - arclayer

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.83-glibc
    container_name: arclayer-rustfs
    restart: unless-stopped
    env_file:
      - ./docker/env/rustfs.env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    networks:
      - arclayer

  mailpit:
    image: axllent/mailpit:v1.29.2
    container_name: arclayer-mailpit
    restart: unless-stopped
    profiles: ["devtools"]
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    volumes:
      - mailpit_data:/data
    networks:
      - arclayer

  dozzle:
    image: amir20/dozzle:v8.12.14
    container_name: arclayer-dozzle
    restart: unless-stopped
    profiles: ["devtools"]
    env_file:
      - ./docker/env/dozzle.env
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - arclayer

  traefik:
    image: traefik:v3.6.9
    container_name: arclayer-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ./docker/env/traefik.env
    volumes:
      - traefik_acme:/acme
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - arclayer

  routes:
    image: alpine:3.20
    container_name: arclayer-routes
    restart: unless-stopped
    command: sleep infinity
    label_file:
      - ./docker/traefik/routes.labels
    networks:
      - arclayer

volumes:
  postgres_data:
  valkey_data:
  meilisearch_data:
  rustfs_data:
  mailpit_data:
  traefik_acme:

networks:
  arclayer:
    driver: bridge
