meta:
  title: 商业化状态机
  theme: tech-blue
  profile: engineering-review
  source: generated
  canvas: 1100x620

nodes:
  - id: active
    label: "Active\n订阅正常"
    type: service
    bounds: { x: 140, y: 128, width: 200, height: 64 }

  - id: dunning
    label: "Dunning\n支付失败 · 催收"
    type: process
    bounds: { x: 460, y: 128, width: 200, height: 64 }

  - id: grace
    label: "Payment Grace\n宽限期 · 可恢复"
    type: process
    bounds: { x: 780, y: 128, width: 200, height: 64 }

  - id: restricted
    label: "Payment Restricted\n数据保留 · 只读可导出"
    type: terminal
    bounds: { x: 780, y: 388, width: 200, height: 64 }

  - id: note
    label: "受限恢复模式（Restricted Recovery Mode）：受限期间保留认证读取、导出与恢复能力\n自动充值（auto-refill）：额度低于阈值时按策略自动补充 Credits"
    type: text
    position: { x: 320, y: 590 }

edges:
  - from: active
    to: dunning
    label: 续费失败
    type: control
  - from: dunning
    to: grace
    label: 催收未果
    type: data
  - from: grace
    to: restricted
    label: 恢复窗口耗尽
    type: data
    labelOffset: { x: 60, y: 0 }
  - from: dunning
    to: active
    label: 支付成功
    type: primary
    labelOffset: { x: 0, y: -110 }
    waypoints:
      - { x: 560, y: 70 }
      - { x: 240, y: 70 }
  - from: grace
    to: active
    label: 支付成功
    type: primary
    labelOffset: { x: -20, y: -132 }
    waypoints:
      - { x: 880, y: 48 }
      - { x: 200, y: 48 }
  - from: restricted
    to: active
    label: 支付纠正 · 恢复
    type: primary
    labelOffset: { x: -120, y: 251 }
    waypoints:
      - { x: 740, y: 525 }
      - { x: 140, y: 525 }
      - { x: 140, y: 160 }
