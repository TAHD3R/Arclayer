meta:
  title: AI 审批流程（Human-in-the-Loop）
  theme: tech-blue
  profile: engineering-review
  source: generated
  layout: horizontal
  canvas: 1260x520

nodes:
  - id: user
    label: "用户消息\n绑定工作区上下文"
    type: user
    bounds: { x: 30, y: 196, width: 160, height: 48 }

  - id: model
    label: "模型步骤\nLiteLLM 路由模型"
    type: llm
    bounds: { x: 250, y: 196, width: 160, height: 48 }

  - id: tool
    label: "工具步骤\n写入工具被拦截"
    type: process
    bounds: { x: 470, y: 196, width: 180, height: 48 }

  - id: approval
    label: "审批中断\nLangGraph interrupt\ncheckpoint 持久化"
    type: decision
    bounds: { x: 740, y: 176, width: 220, height: 88 }

  - id: exec
    label: "执行与结算\n流式推送 · 用量结算"
    type: service
    bounds: { x: 1050, y: 196, width: 180, height: 48 }

  - id: deny
    label: "用户拒绝\n按拒绝分支结束\n不产生写入"
    type: terminal
    bounds: { x: 1050, y: 416, width: 180, height: 60 }

edges:
  - from: user
    to: model
    type: primary
  - from: model
    to: tool
    type: primary
  - from: tool
    to: approval
    label: 写入意图
    type: control
  - from: approval
    to: exec
    label: "批准 · Command 注入"
    type: primary
  - from: approval
    to: deny
    label: 拒绝
    type: optional
    labelOffset: { x: 0, y: 14 }
    waypoints:
      - { x: 850, y: 320 }
      - { x: 1140, y: 320 }
  - from: exec
    to: model
    label: 多步骤任务继续
    type: feedback
    waypoints:
      - { x: 1260, y: 80 }
      - { x: 330, y: 80 }
