<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f6f7f9; color: #0b1220">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr>
        <td style="padding: 32px 12px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e6e8ee"
          >
            <tr>
              <td style="padding: 24px 24px 0 24px">
                <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700">
                  {{ title }}
                </h1>
                <p style="margin: 12px 0 0 0; font-size: 14px; line-height: 1.6; color: #4b5563">
                  {{ intro }}
                </p>
              </td>
            </tr>

            {% if reset_url %}
            <tr>
              <td style="padding: 18px 24px 0 24px">
                <a
                  href="{{ reset_url }}"
                  style="
                    display: inline-block;
                    background: #1677ff;
                    color: #ffffff;
                    text-decoration: none;
                    padding: 12px 16px;
                    font-size: 14px;
                    font-weight: 600;
                    border-radius: 0;
                  "
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  {{ cta }}
                </a>
              </td>
            </tr>
            {% endif %}

            <tr>
              <td style="padding: 18px 24px 0 24px">
                <p style="margin: 0; font-size: 13px; line-height: 1.6; color: #4b5563">
                  {{ fallback }}
                </p>
                <div
                  style="
                    margin-top: 10px;
                    padding: 12px 14px;
                    background: #0b1220;
                    color: #ffffff;
                    font-family:
                      ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
                      &quot;Liberation Mono&quot;, &quot;Courier New&quot;, monospace;
                    font-size: 14px;
                    letter-spacing: 0.4px;
                    border-radius: 0;
                  "
                >
                  {{ reset_token }}
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding: 18px 24px 24px 24px">
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280">
                  {{ expires_notice }}
                </p>
                <p style="margin: 8px 0 0 0; font-size: 12px; line-height: 1.6; color: #6b7280">
                  {{ ignore_notice }}
                </p>
              </td>
            </tr>
          </table>

          <div
            style="
              max-width: 560px;
              margin: 12px auto 0 auto;
              text-align: center;
              font-size: 12px;
              color: #9aa2af;
            "
          >
            Celestial CMS
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
