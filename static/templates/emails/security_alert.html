<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
  </head>
  <body style="margin: 0; padding: 0; background: #f6f7f9; color: #0b1220">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
      <tr>
        <td style="padding: 32px 12px">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="max-width: 560px; margin: 0 auto; background: #ffffff; border: 1px solid #e6e8ee"
          >
            <tr>
              <td style="padding: 24px 24px 0 24px">
                <h1 style="margin: 0; font-size: 22px; line-height: 1.3; font-weight: 700">
                  {{ title }}
                </h1>
                <p style="margin: 12px 0 0 0; font-size: 14px; line-height: 1.6; color: #4b5563">
                  {{ intro }}
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 24px 0 24px">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td style="padding: 8px 0; font-size: 13px; color: #6b7280">Event</td>
                    <td style="padding: 8px 0; font-size: 13px; color: #0b1220">{{ event_label }}</td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; font-size: 13px; color: #6b7280">Time</td>
                    <td style="padding: 8px 0; font-size: 13px; color: #0b1220">{{ occurred_at }}</td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; font-size: 13px; color: #6b7280">IP</td>
                    <td style="padding: 8px 0; font-size: 13px; color: #0b1220">{{ ip_address }}</td>
                  </tr>
                  <tr>
                    <td style="padding: 8px 0; font-size: 13px; color: #6b7280">Device</td>
                    <td style="padding: 8px 0; font-size: 13px; color: #0b1220">{{ user_agent }}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 18px 24px 24px 24px">
                <p style="margin: 0; font-size: 12px; line-height: 1.6; color: #6b7280">
                  {{ ignore_notice }}
                </p>
              </td>
            </tr>
          </table>
          <div
            style="
              max-width: 560px;
              margin: 12px auto 0 auto;
              text-align: center;
              font-size: 12px;
              color: #9aa2af;
            "
          >
            Arclayer
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
