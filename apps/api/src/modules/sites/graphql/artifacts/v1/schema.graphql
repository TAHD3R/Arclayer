  deliveryGlobalSet(key: String!, perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null): GraphQLGlobalSet!
  articleBySlug(slug: String!, perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null): ArticleEntry
  articles(perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null, filter: ArticleFilterInput = null, sort: ArticleSortInput = null, limit: Int! = 20, offset: Int! = 0): [ArticleEntry!]!
  pageEntryByPath(path: String!, perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null): PageEntry
  pages(perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null, filter: PageFilterInput = null, sort: PageSortInput = null, limit: Int! = 20, offset: Int! = 0): [PageEntry!]!
  reusableSectionByAlias(alias: String!, perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null): ReusableSectionEntry
  reusableSections(perspective: DeliveryPerspective! = PUBLISHED, previewToken: String = null, filter: ReusableSectionFilterInput = null, sort: ReusableSectionSortInput = null, limit: Int! = 20, offset: Int! = 0): [ReusableSectionEntry!]!
