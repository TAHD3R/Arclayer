type ArticleEntry {
  id: String!
  locale: String!
  revision: Int!
  revisionState: String!
  draftRevision: Int!
  publishedRevision: Int
  title: String
  slug: String
  summary: String
  content: String
  publishedAt: String
  customFields: JSON!
}

input ArticleFilterInput {
  slug: String = null
  titleContains: String = null
  revisionState: String = null
}

enum ArticleSortField {
  TITLE
  SLUG
  REVISION
}

input ArticleSortInput {
  field: ArticleSortField!
  direction: GraphQLSortDirection! = ASC
}

type CategoryEntry {
  id: String!
  locale: String!
  revision: Int!
  revisionState: String!
  draftRevision: Int!
  publishedRevision: Int
  name: String
  slug: String
  description: String
  customFields: JSON!
}

input CategoryFilterInput {
  slug: String = null
  nameContains: String = null
  revisionState: String = null
}

enum CategorySortField {
  NAME
  SLUG
  REVISION
}

input CategorySortInput {
  field: CategorySortField!
  direction: GraphQLSortDirection! = ASC
}

enum DeliveryPerspective {
  PUBLISHED
  PREVIEW
}

type GraphQLDeliveryPage {
  match: GraphQLRouteMatch!
  pageMeta: GraphQLPageMeta
  document: GraphQLFlattenedPage
  context: GraphQLRouteContext
  warnings: [GraphQLResolveWarning!]
}

type GraphQLDeliverySection {
  id: String!
  alias: String!
  title: String
  revision: Int!
  revisionState: String!
  draftRevision: Int!
  publishedRevision: Int
  document: GraphQLDeliverySectionDocument!
  warnings: [GraphQLResolveWarning!]
}

type GraphQLDeliverySectionDocument {
  layout: JSON
  sections: [GraphQLFlattenedSection!]!
}

type GraphQLFlattenedPage {
  path: String!
  layout: JSON
  sections: [GraphQLFlattenedSection!]!
}

type GraphQLFlattenedSection {
  id: String!
  componentKey: String!
  props: JSON!
}

type GraphQLGlobalSet {
  key: String!
  items: [GraphQLGlobalSetItem!]!
}

type GraphQLGlobalSetItem {
  id: String!
  name: String!
  key: String!
  payload: JSON
  sectionAlias: String
  section: GraphQLDeliverySection
}

type GraphQLPageMeta {
  title: String
  description: String
}

type GraphQLPrimaryContext {
  id: String!
  modelKey: String
  slug: String
  title: String
  data: JSON!
}

type GraphQLResolveWarning {
  code: String!
  message: String!
  refEntryId: String
  refNodeId: String
}

type GraphQLRouteContext {
  primary: GraphQLPrimaryContext
  routeParams: JSON!
}

type GraphQLRouteMatch {
  kind: String!
  params: JSON!
  pageId: String
  variantId: String
  revision: Int
  revisionState: String
  draftRevision: Int
  publishedRevision: Int
}

enum GraphQLSortDirection {
  ASC
  DESC
}

