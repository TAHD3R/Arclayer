type PageEntry {
  id: String!
  locale: String!
  revision: Int!
  revisionState: String!
  draftRevision: Int!
  publishedRevision: Int
  title: String
  path: String
  routePattern: String
  customFields: JSON!
}

input PageFilterInput {
  path: String = null
