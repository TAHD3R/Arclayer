[project]
name = "Arclayer"
version = "2026.01.18-dev"
description = "Structured content, visually built."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Jassar Ayiken", email = "aspj6771@gmail.com" }]
dependencies = [
  "asgi-correlation-id>=4.3.4",
  "bcrypt>=4.2.1",
  "fastapi>=0.135.1",
  "fastapi-guard>=5.0.0",
  "granian>=2.6.1",
  "httpx>=0.28.1",
  "asyncpg>=0.30.0",
  "orjson>=3.11.5",
  "pluggy>=1.6.0",
  "pydantic[email]>=2.12.5",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "redis>=7.2.0,<8",
  "structlog>=25.5.0",
  "taskiq>=0.11.18",
  "taskiq-redis>=1.0.3",
  "tortoise-orm>=1.1.5",
  "uvicorn[standard]>=0.40.0",
  "valkey>=6.1.1",
  "watchfiles>=1.1.1",
  "uuid6>=2024.7.10",
  "setuptools>=80.9.0",
  "fastapi-mail>=1.6.1",
  "python-multipart>=0.0.21",
  "pillow>=11.1.0",
  "boto3>=1.34.0",
  "dnspython>=2.8.0",
  "uvloop>=0.22.1",
  "httptools>=0.7.1",
]

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "pyupgrade>=3.21.2",
  "ruff>=0.14.13",
  "safety>=3.7.0",
  "ty>=0.0.29",
]

[tool.uv]
cache-dir = ".uv-cache"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.tortoise]
tortoise_orm = "src.core.database.orm.TORTOISE_ORM"

[tool.ruff]
preview = true
line-length = 120
indent-width = 4
lint.select = [
  "B",
  "C4",
  "F",
  "I",
  "UP",
  # "S",
  # "C90",
  "B035",
  "E101",
  "E111",
  "E112",
  "E113",
  "E115",
  "E116",
  "E117",
  "RUF019",
  "RUF100",
  "RUF101",
  "S506",
  "SIM116",
  "SIM401",
  "SIM910",
  "W191",
  "W605",
  "F601",
  "F602",
  "F821",
]
lint.ignore = [
  "F403",
  "F405",
  "F841",
  "UP007",
  "UP032",
  "B005",
  "B006",
  "B007",
  "B008",
  "B026",
  "B901",
  "B904",
  "B905",
]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "migrations"]

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib --cov=src --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services (database, valkey)",
    "unit: tests that exercise dependency-light units without external services",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = [
  "**/__pycache__",
  "**/.venv",
  "**/node_modules",
  "**/.turbo",
  "**/dist",
  "**/build",
  "src/migrations/**",
]

[tool.ty.rules]
unknown-argument = "warn"
invalid-argument-type = "warn"
no-matching-overload = "warn"
