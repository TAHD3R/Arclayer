[project]
name = "Celestial"
version = "2026.01.18-dev"
description = "Celestial is a light-weight, modular plugin-based ASGI python framework based on FastAPI."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Jassar Ayiken", email = "aspj6771@gmail.com" }]
dependencies = [
  "aerich[toml]>=0.9.2",
  "arq>=0.26.0",
  "asgi-correlation-id>=4.3.4",
  "bcrypt>=4.2.1",
  "fastapi[standard]>=0.128.0",
  "granian>=2.6.1",
  "httpx>=0.28.1",
  "asyncpg>=0.30.0",
  "orjson>=3.11.5",
  "pluggy>=1.6.0",
  "pydantic[email]>=2.12.5",
  "pydantic-settings>=2.12.0",
  "pyjwt>=2.10.1",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "redis>=5.0.0",
  "sentry-sdk>=2.35.0",
  "structlog>=25.5.0",
  "tortoise-orm>=0.25.0",
  "uvicorn[standard]>=0.40.0",
  "valkey>=6.1.1",
  "watchfiles>=1.1.1",
  "fastapi-cache2[redis]>=0.1.8",
  "fastapi-limiter>=0.2.0",
  "uuid6>=2024.7.10",
  "setuptools>=80.9.0",
  "fastapi-mail>=1.6.1",
  "python-multipart>=0.0.21",
  "pillow>=11.1.0",
  "boto3>=1.34.0",
  "dnspython>=2.8.0",
  "uvloop>=0.22.1",
  "httptools>=0.7.1",
]

[dependency-groups]
dev = [
  "pre-commit>=4.5.1",
  "pyright>=1.1.408",
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "pyupgrade>=3.21.2",
  "ruff>=0.14.13",
  "safety>=3.7.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.aerich]
tortoise_orm = "apps.api.core.database.orm.TORTOISE_ORM"
location = "./migrations"
src_folder = "../.."
app = "models"
