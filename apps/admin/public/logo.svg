<svg width="220" height="220" viewBox="8 8 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arclayer Arc Weave</title>
  <desc id="desc">Four interlocking arc stones rendered as one continuous graphite material field.</desc>
  <defs>
    <path id="arc-piece" d="M77 4C49 -7 18 8 6 36C-5 63 7 93 34 107C61 120 92 109 108 84C96 73 83 64 69 57C63 72 46 80 32 71C16 61 15 40 28 28C40 17 58 20 69 33C73 23 76 13 77 4Z"/>
    <mask id="arc-weave-mask" maskUnits="userSpaceOnUse" x="-16" y="-16" width="288" height="288" style="mask-type:alpha">
      <g fill="white">
        <g transform="translate(84 84) rotate(45) scale(1.15) translate(-56 -56)"><use href="#arc-piece"/></g>
        <g transform="translate(172 84) rotate(135) scale(1.15) translate(-56 -56)"><use href="#arc-piece"/></g>
        <g transform="translate(172 172) rotate(225) scale(1.15) translate(-56 -56)"><use href="#arc-piece"/></g>
        <g transform="translate(84 172) rotate(315) scale(1.15) translate(-56 -56)"><use href="#arc-piece"/></g>
      </g>
    </mask>
    <linearGradient id="graphite-base" x1="32" y1="24" x2="230" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4B4C53"/>
      <stop offset="0.46" stop-color="#292A2F"/>
      <stop offset="1" stop-color="#4C4D54"/>
    </linearGradient>
    <radialGradient id="light-northwest" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(48 43) rotate(43) scale(132)">
      <stop stop-color="#A1A2A9" stop-opacity="0.74"/>
      <stop offset="0.68" stop-color="#777880" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#777880" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light-southeast" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(211 216) rotate(-137) scale(126)">
      <stop stop-color="#85868E" stop-opacity="0.76"/>
      <stop offset="0.7" stop-color="#6A6B73" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6A6B73" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade-southwest" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(42 213) rotate(-44) scale(130)">
      <stop stop-color="#06070A" stop-opacity="0.88"/>
      <stop offset="0.66" stop-color="#111216" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#111216" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade-northeast" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(218 40) rotate(136) scale(122)">
      <stop stop-color="#101115" stop-opacity="0.72"/>
      <stop offset="0.72" stop-color="#17181C" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#17181C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g mask="url(#arc-weave-mask)">
    <rect x="-16" y="-16" width="288" height="288" fill="url(#graphite-base)"/>
    <rect x="-16" y="-16" width="288" height="288" fill="url(#light-northwest)"/>
    <rect x="-16" y="-16" width="288" height="288" fill="url(#light-southeast)"/>
    <rect x="-16" y="-16" width="288" height="288" fill="url(#shade-southwest)" style="mix-blend-mode:multiply"/>
    <rect x="-16" y="-16" width="288" height="288" fill="url(#shade-northeast)" style="mix-blend-mode:multiply"/>
  </g>
</svg>
