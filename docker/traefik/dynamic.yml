http:
  routers:
    # Convenience route: allow API calls through the Product host when a browser
    # or test follows relative /api URLs from https://app.arclayer.localhost.
    admin-api:
      entryPoints:
        - websecure
      rule: "Host(`app.arclayer.localhost`) && PathPrefix(`/api/`)"
      service: api
      tls: {}
      priority: 20

    api:
      entryPoints:
        - websecure
      rule: "Host(`api.arclayer.localhost`)"
      service: api
      tls: {}
      priority: 10

    project-sites:
      entryPoints:
        - websecure
      rule: "HostRegexp(`^.+\\.arclayer\\.localhost$`)"
      service: api
      tls: {}
      priority: 1

    admin:
      entryPoints:
        - websecure
      rule: "Host(`app.arclayer.localhost`)"
      service: admin
      tls: {}
      priority: 10

    platform-api:
      entryPoints:
        - websecure
      rule: "Host(`platform.arclayer.localhost`) && PathPrefix(`/platform-api/`)"
      service: platform-api
      tls: {}
      priority: 20

    platform:
      entryPoints:
        - websecure
      rule: "Host(`platform.arclayer.localhost`)"
      service: platform
      tls: {}
      priority: 10

    traefik-dashboard:
      entryPoints:
        - websecure
      rule: "Host(`traefik.arclayer.localhost`)"
      service: api@internal
      tls: {}
      priority: 10

    storage:
      entryPoints:
        - websecure
      rule: "Host(`storage.arclayer.localhost`)"
      service: rustfs-api
      tls: {}
      priority: 10

    rustfs-console:
      entryPoints:
        - websecure
      rule: "Host(`rustfs.arclayer.localhost`)"
      service: rustfs-console
      tls: {}
      priority: 10

  services:
    api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:8000"

    platform-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:8001"

    admin:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:5173"

    platform:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://host.docker.internal:5174"

    rustfs-api:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://rustfs:9000"

    rustfs-console:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://rustfs:9001"

tls:
  certificates:
    - certFile: /certs/arclayer.localhost.pem
      keyFile: /certs/arclayer.localhost-key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /certs/arclayer.localhost.pem
        keyFile: /certs/arclayer.localhost-key.pem
