[project]
name = "CelestialCMS"
version = "0.20.0"
description = "Celestial is a light-weight, plugin-based CMS framework written in Python."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jassar Ayiken", email = "aspj6771@gmail.com" }]
dependencies = [
    "aerich[toml]>=0.9.2",
    "asgi-correlation-id>=4.3.4",
    "fastapi>=0.128.0",
    "granian>=2.6.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "orjson>=3.11.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.13",
    "safety>=3.7.0",
]

[tool.ruff]
preview = true
line-length = 120
indent-width = 4
lint.select = [
    "B",
    "C4",
    "F",
    "I",
    "UP",
    "S",
    "C90",
    "B035",
    "E101",
    "E111",
    "E112",
    "E113",
    "E115",
    "E116",
    "E117",
    "RUF019",
    "RUF100",
    "RUF101",
    "S506",
    "SIM116",
    "SIM401",
    "SIM910",
    "W191",
    "W605",
    "F601",
    "F602",
    "F821",
]
lint.ignore = [
    "F403",
    "F405",
    "F841",
    "UP007",
    "UP032",
    "B005",
    "B006",
    "B007",
    "B008",
    "B026",
    "B901",
    "B904",
    "B905",
]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "migrations"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", "migrations"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.13"
