[tool.ruff]
preview = true
line-length = 120
indent-width = 4
lint.select = [
  "B",
  "C4",
  "F",
  "I",
  "UP",
  # "S",
  # "C90",
  "B035",
  "E101",
  "E111",
  "E112",
  "E113",
  "E115",
  "E116",
  "E117",
  "RUF019",
  "RUF100",
  "RUF101",
  "S506",
  "SIM116",
  "SIM401",
  "SIM910",
  "W191",
  "W605",
  "F601",
  "F602",
  "F821",
]
lint.ignore = [
  "F403",
  "F405",
  "F841",
  "UP007",
  "UP032",
  "B005",
  "B006",
  "B007",
  "B008",
  "B026",
  "B901",
  "B904",
  "B905",
]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "migrations"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"apps/api/tests/*" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --import-mode=importlib --cov=apps.api.src --cov-report=term-missing"
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: tests that require external services (database, valkey)"]

[tool.pyright]
include = ["apps/api"]
exclude = [
  "**/__pycache__",
  "**/.venv",
  "**/node_modules",
  "**/.turbo",
  "**/dist",
  "**/build",
  "migrations",
]
extraPaths = ["."]
venvPath = "apps/api"
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.12"
