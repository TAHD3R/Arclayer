[project]
name = "Celestial"
version = "2026.01.18-dev"
description = "Celestial is a light-weight, modular plugin-based ASGI python framework based on FastAPI."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Jassar Ayiken", email = "aspj6771@gmail.com" }]
dependencies = [
    "aerich[toml]>=0.9.2",
    "asgi-correlation-id>=4.3.4",
    "bcrypt>=4.2.1",
    "fastapi>=0.128.0",
    "granian>=2.6.1",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "orjson>=3.11.5",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "redis>=5.0.0",
    "sentry-sdk>=2.35.0",
    "structlog>=25.5.0",
    "tortoise-orm>=0.25.0",
    "uvicorn>=0.40.0",
    "valkey>=6.1.1",
    "fastapi-cache2[redis]>=0.1.8",
    "fastapi-limiter>=0.1.6",
    "uuid6>=2024.7.10",
    "setuptools>=80.9.0",
    "fastapi-mail>=1.6.1",
    "python-multipart>=0.0.21",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "pyupgrade>=3.21.2",
    "ruff>=0.14.13",
    "safety>=3.7.0",
]

[tool.ruff]
preview = true
line-length = 120
indent-width = 4
lint.select = [
    "B",
    "C4",
    "F",
    "I",
    "UP",
    # "S",
    # "C90",
    "B035",
    "E101",
    "E111",
    "E112",
    "E113",
    "E115",
    "E116",
    "E117",
    "RUF019",
    "RUF100",
    "RUF101",
    "S506",
    "SIM116",
    "SIM401",
    "SIM910",
    "W191",
    "W605",
    "F601",
    "F602",
    "F821",
]
lint.ignore = [
    "F403",
    "F405",
    "F841",
    "UP007",
    "UP032",
    "B005",
    "B006",
    "B007",
    "B008",
    "B026",
    "B901",
    "B904",
    "B905",
]
exclude = [".git", ".venv", "__pycache__", "build", "dist", "migrations"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff.format]
indent-style = "space"
docstring-code-format = true
skip-magic-trailing-comma = false
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["apps"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --cov=apps/api --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests that require external services (database, valkey)",
]

[tool.pyright]
include = ["apps"]
exclude = ["**/__pycache__", "migrations"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.13"

[tool.aerich]
tortoise_orm = "apps.api.infra.db.orm.TORTOISE_ORM"
location = "./apps/api/migrations"
src_folder = "./."
app = "models"
